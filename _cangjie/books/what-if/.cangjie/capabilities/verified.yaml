- capability_id: cap.what-if.selection-bias-immortal-time
  revision: 1
  status: active
  aliases: []
  supersedes: []
  merged_into: null
  split_into: []
  slug: selection-bias-immortal-time
  title: 选择偏倚与永恒时间偏倚：时间零点一错，全盘皆错
  importance: critical
  importance_rationale: 第 8 章专章讨论，第 22.4 节单列 'Time zero'；永恒时间偏倚是真实世界研究最高发、也最难自查的设计性错误，本书把它归入选择偏倚的图结构。
  one_liner: 入组、治疗分配、随访开始必须落在同一时刻；只要它们错开，就有人必须先活够一段时间才'配'被治疗。
  intents:
  - 识别并改正永恒时间偏倚（immortal time bias）
  - 判断研究中是否存在因条件于未来事件而产生的选择偏倚
  - 为生存/随访研究确定正确的时间零点
  - 处理删失与失访带来的选择偏倚
  keywords:
  - 永恒时间偏倚
  - immortal time bias
  - 选择偏倚
  - selection bias
  - time zero
  - 时间零点
  - 删失
  - censoring
  - 失访
  - survivor bias
  also_read:
  - target-trial-emulation
  - bias-structure-diagnosis
  - time-varying-gmethods
  card: cards/selection-bias-immortal-time.md
  frontmatter:
    description: '当用户的研究存在''必须先存活/满足某条件才能进入治疗组''的结构，或入组与治疗开始不同步时用。

      永恒时间偏倚是选择偏倚的特例：条件于一个发生在治疗之后、又是结局共同结果的事件。

      触发信号：永恒时间偏倚 / immortal time bias / 时间零点 / time zero / 入组和用药不同步 / 生存分析里的存活者偏倚 / 删失失访怎么校正。

      不适用于：治疗不随时间变化且时间零点已对齐的常规混杂问题（走因果图识别）、

      以及时变混杂反馈导致的偏倚（走时变 G 方法）。'
    tags:
    - causal-inference
    - bias
    - survival-analysis
    - study-design
  source_evidence:
