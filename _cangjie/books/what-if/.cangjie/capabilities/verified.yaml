- capability_id: cap.what-if.standardization-gformula
  revision: 1
  status: active
  aliases: []
  supersedes: []
  merged_into: null
  split_into: []
  slug: standardization-gformula
  title: 标准化与 g-formula：把结局模型铺到整个人群上
  importance: critical
  importance_rationale: 第 2.3 节在 Part I 就给出无模型版标准化，第 13 章升级为参数 g-formula，第 21.1 节推广到时变处理——是全书两条主干估计路径之一。
  one_liner: 给每个人预测'若治疗'和'若不治疗'两个结局，再对全人群各求一次平均，两个平均相减。
  intents:
  - 用标准化（standardization）估计平均因果效应
  - 用参数 g-formula 估计治疗效应
  - 比较 IP 加权与标准化的取舍
  - 估计时变处理的 g-formula
  keywords:
  - 标准化
  - standardization
  - g-formula
  - g-formula 参数
  - parametric g-formula
  - outcome regression
  - 结局回归
  - average causal effect
  also_read:
  - ip-weighting-msm
  - time-varying-gmethods
  - doubly-robust-estimation
  card: cards/standardization-gformula.md
  frontmatter:
    description: '当用户要用结局模型估计平均因果效应，或在 IP 加权与标准化之间取舍时用。

      标准化（g-formula）先拟合 E[Y|A,L]，对每个个体分别预测 A=1 与 A=0 下的结局，

      再对全人群各取平均并相减；时变情形推广为多期 g-formula。

      触发信号：标准化 / standardization / g-formula / 结局回归估计因果效应 / IP 加权还是标准化 / 怎么估计平均因果效应 / 时变处理的 g-formula。

      不适用于：需要估计边际结构模型参数的时变情形（走时变 G 方法的 IP 加权路径）、

      无模型可用的非参数快速核对（第 2.3 节的非参数标准化仍是首选）、以及未测混杂的内生性问题。'
    tags:
    - causal-inference
    - estimation
    - g-methods
  source_evidence:
