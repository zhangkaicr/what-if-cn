  slug: causal-dag-identification
  title: 因果图识别与后门准则
  importance: critical
  importance_rationale: 第 6、7 章是 Part I 的识别论核心，后门准则被第 7.3、7.6 节确立为混杂调整的操作标准，并被 Part II/III 所有估计方法默认依赖。
  one_liner: 把假设画成箭头，再用后门准则挑调整集合——调整不该靠'把所有变量都塞进模型'。
  intents:
  - 画出某个研究问题的因果图（DAG）
  - 判断该调整哪些变量、不该调整哪些
  - 用后门准则找出可识别的调整集合
  - 判断某变量是混杂因子、中介还是对撞节点
  keywords:
  - DAG
  - 因果图
  - directed acyclic graph
  - backdoor criterion
  - 后门准则
  - d-separation
  - collider
  - 对撞节点
  - confounder
  - 混杂
  also_read:
  - bias-structure-diagnosis
  - variable-selection-causal
  - identifiability-conditions
  card: cards/causal-dag-identification.md
  frontmatter:
    description: '当用户需要画因果图、判断调整集合、或问''这个变量该不该放进模型''时用。

      以 d-分离判断边际/条件独立，用后门准则挑选足以阻断所有后门路径的协变量集合。

      触发信号：画 DAG / 因果图 / 混杂怎么调整 / backdoor / d-separation / collider / 对撞节点 / 这个变量该不该调整 / 调整集合。

      不适用于：纯粹的变量筛选（走因果变量选择）、时间依赖的时变混杂（走时变 G 方法）、以及只想问''这是哪种偏倚''（走偏倚结构化分类）。'
