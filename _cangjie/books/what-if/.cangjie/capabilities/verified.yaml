  slug: target-trial-emulation
  title: 目标试验模拟：先写试验方案，再碰数据
  importance: critical
  importance_rationale: 第 3.6 节与第 22 章是全书的方法论枢纽；作者自称本书围绕'把因果问题说清楚'展开，其余各章的估计方法都在方案定型之后才登场。
  one_liner: 拿到观察性数据先别建模，先把'我本来想做的那个随机试验'的 7 项方案写出来。
  intents:
  - 用真实世界数据估计某个治疗/暴露的因果效应
  - 判断一个回顾性分析能不能回答所提的因果问题
  - 厘清 ITT 效应与 per-protocol（依从方案）效应的区别
  - 确定队列研究的时间零点与入组标准
  keywords:
  - 目标试验
  - target trial
  - 真实世界证据
  - RWE
  - ITT
  - per-protocol
  - time zero
  - 时间零点
  - eligibility
  also_read:
  - identifiability-conditions
  - selection-bias-immortal-time
  - ip-weighting-msm
  card: cards/target-trial-emulation.md
  frontmatter:
    description: '当用户要用观察性/真实世界数据回答''X 对 Y 的因果效应''时，先把目标试验方案写实：

      eligibility、治疗策略、分配机制、时间零点、随访终点、结局、因果对比（ITT 或 per-protocol）、分析计划。

      触发信号：真实世界研究、回顾性队列、目标试验、target trial、时间零点怎么定、ITT 还是 per-protocol、这个研究设计能不能回答因果问题。

      不适用于：纯预测/预后问题（不问干预效果）、干预本身无法定义成可执行动作、以及只需选估计方法而方案已定的场景（那种情况直接走 IP 加权或 g-formula）。'
    tags:
    - causal-inference
    - study-design
    - framework
  source_evidence:
