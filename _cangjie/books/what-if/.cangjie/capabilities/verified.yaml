- capability_id: cap.what-if.bias-structure-diagnosis
  revision: 1
  status: active
  aliases: []
  supersedes: []
  merged_into: null
  split_into: []
  slug: bias-structure-diagnosis
  title: 偏倚的结构化分类：按图的结构认偏倚，不按名字认偏倚
  importance: critical
  importance_rationale: 第 6.5 节提出的分类是 Part I 后半段（第 7、8、9 章）的组织骨架，作者明确指出三类偏倚只是图结构不同。
  one_liner: 混杂 = 共同原因；选择偏倚 = 条件于共同结果；测量偏倚 = 变量测错了或测的是代理。
  intents:
  - 判断一个观察到的偏倚属于混杂、选择偏倚还是测量偏倚
  - 用一个统一的框架梳理研究中所有可能的偏倚来源
  - 判断某偏倚能否用已有数据校正
  keywords:
  - 偏倚
  - bias
  - 混杂
  - confounding
  - 选择偏倚
  - selection bias
  - 测量偏倚
  - measurement bias
  - 结构分类
  - structural classification
  also_read:
  - causal-dag-identification
  - selection-bias-immortal-time
  - variable-selection-causal
  card: cards/bias-structure-diagnosis.md
  frontmatter:
    description: '当用户问''这算混杂还是选择偏倚''''这个偏倚能不能校正''时用。

      按因果图的结构给偏倚定类：共同原因 → 混杂；条件于共同结果（对撞节点）→ 选择偏倚；

      变量测错或用了代理 → 测量偏倚。定类之后才知道该调整什么、能不能调整。

      触发信号：这是哪种偏倚 / 混杂 vs 选择偏倚 / 能不能校正 / bias 分类 / collider 引入的偏倚。

      不适用于：只想找调整集合（走因果图识别）、已经确定是时间零点不对齐导致的永恒时间偏倚（走专项能力）、

      以及纯统计的随机误差问题（走识别与估计的区分）。'
    tags:
    - causal-inference
    - bias
    - diagnosis
  source_evidence:
  - source_id: src-main-book
    location: 第 6.5 节 A structural classification of bias；第 7 章 Confounding；第 8 章 Selection bias；第 9 章 Measurement bias and
      「Noncausal」 diagrams
  promotion:
