  - 交互
  - interaction
  - 亚组分析
  - subgroup
  - 异质性
  - heterogeneity
  - sufficient cause
  - 充分原因
  - scale dependence
  - 尺度依赖
  also_read:
  - causal-dag-identification
  - standardization-gformula
  - variable-selection-causal
  card: cards/effect-modification-interaction.md
  frontmatter:
    description: '当用户做亚组分析、解读异质性、或问''这两个因素有没有交互''时用。

      效应修饰是效应大小随某变量变化（且依赖效应尺度，非因果性的''交互''）；

      交互则要求两个干预可被联合施加，是真正的因果概念。

